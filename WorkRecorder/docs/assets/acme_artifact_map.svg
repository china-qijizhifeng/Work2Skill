<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">ACME artifact map</title>
  <desc id="desc">Artifact map for the ACME Chrome case, showing default visibility and provenance.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .h{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .t{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .s{font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .tag{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .line{stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1180" height="620" rx="28" fill="#f8fafc"/>
  <text x="54" y="58" class="h">ACME case：一次 event 里的真实 artifact 分层</text>
  <text x="54" y="84" class="t">同一条事件里既有原始证据，也有 daemon 派生出的 Agent 可读证据。默认披露只给安全摘要。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="128" width="240" height="120" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="80" y="148" width="70" height="22" rx="11" fill="#f97316"/>
    <text x="94" y="164" class="tag">RAW</text>
    <text x="80" y="196" class="s">screenshot</text>
    <text x="80" y="222" class="t">system.screenshot / PNG</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="330" y="128" width="240" height="120" rx="18" fill="#fef2f2" stroke="#fca5a5"/>
    <rect x="350" y="148" width="92" height="22" rx="11" fill="#dc2626"/>
    <text x="365" y="164" class="tag">HIDDEN</text>
    <text x="350" y="196" class="s">browser_full_dom</text>
    <text x="350" y="222" class="t">web provider / quarantined</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="128" width="240" height="120" rx="18" fill="#fef2f2" stroke="#fca5a5"/>
    <rect x="620" y="148" width="92" height="22" rx="11" fill="#dc2626"/>
    <text x="635" y="164" class="tag">HIDDEN</text>
    <text x="620" y="196" class="s">a11y_tree</text>
    <text x="620" y="222" class="t">system.macos_a11y / raw UI tree</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="870" y="128" width="240" height="120" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="890" y="148" width="94" height="22" rx="11" fill="#2563eb"/>
    <text x="906" y="164" class="tag">META</text>
    <text x="890" y="196" class="s">selection_map</text>
    <text x="890" y="222" class="t">bbox -> DOM / evidence refs</text>
  </g>

  <line class="line" x1="180" y1="248" x2="180" y2="306"/>
  <line class="line" x1="450" y1="248" x2="450" y2="306"/>
  <line class="line" x1="720" y1="248" x2="720" y2="306"/>
  <line class="line" x1="990" y1="248" x2="990" y2="306"/>
  <line class="line" x1="180" y1="306" x2="990" y2="306"/>
  <line class="line" x1="585" y1="306" x2="585" y2="342"/>

  <g filter="url(#shadow)">
    <rect x="250" y="342" width="240" height="130" rx="18" fill="#ecfdf5" stroke="#86efac"/>
    <rect x="270" y="362" width="94" height="22" rx="11" fill="#16a34a"/>
    <text x="286" y="378" class="tag">SUMMARY</text>
    <text x="270" y="410" class="s">selection_text</text>
    <text x="270" y="436" class="t">截图框内文字</text>
    <text x="270" y="458" class="t">粗搜默认可见</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="342" width="240" height="130" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="540" y="362" width="88" height="22" rx="11" fill="#2563eb"/>
    <text x="556" y="378" class="tag">INSPECT</text>
    <text x="540" y="410" class="s">clean_page_text</text>
    <text x="540" y="436" class="t">网页正文清洗版</text>
    <text x="540" y="458" class="t">按 event_id 精查可见</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="790" y="342" width="240" height="130" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="810" y="362" width="88" height="22" rx="11" fill="#2563eb"/>
    <text x="826" y="378" class="tag">INDEX</text>
    <text x="810" y="410" class="s">canonical_text</text>
    <text x="810" y="436" class="t">搜索和 bundle 文本</text>
    <text x="810" y="458" class="t">保留 parent evidence ids</text>
  </g>

  <text x="70" y="540" class="t">读者可以把它理解成一份本地案卷：raw 原料被保管，安全文本被索引，Agent 每次读取都会留下 snapshot 和 citation。</text>
</svg>
