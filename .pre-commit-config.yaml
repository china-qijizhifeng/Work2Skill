repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: workrecorder-quality-gate
        name: WorkRecorder quality gate
        entry: bash -c 'cd WorkRecorder && uv run --extra dev python -m scripts.quality_gate'
        language: system
        pass_filenames: false
