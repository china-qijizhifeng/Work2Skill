type: tool
name: write_file
description: >-
  Writes content to a file, creates missing parent directories, and overwrites
  an existing file. This scoped adapter only permits the generated output root.
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: The path to the file to write to.
    content:
      type: string
      description: The content to write to the file.
  required: [file_path, content]
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
