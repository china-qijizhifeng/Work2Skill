type: tool
name: finalize_extraction
description: >-
  Finalize the extraction after every generated SKILL.md has been completely
  written and read back with read_file. This tool validates task reading,
  final Skill structure, post-write readback, and video metadata ordering, then
  atomically writes the runtime-owned extraction manifest. On failure, fix
  every reported issue and call this tool again.
input_schema:
  type: object
  properties: {}
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
